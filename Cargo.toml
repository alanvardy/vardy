[package]
name = "vardy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
minijinja = { version = "2", features = ["debug"] }
prometheus = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentry = "0.49"
sha2 = "0.11"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "chrono", "migrate", "json"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tower_governor = { version = "0.8", features = ["axum"] }
governor = "0.10"
tower-http = { version = "0.7", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.13", features = ["form", "json", "query"] }
chrono = "0.4"

[dev-dependencies]
tower = "0.5"
rust_arkitect = "0.3.7"
syn = { version = "3", features = ["full", "visit"] }
