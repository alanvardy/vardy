# This job will only run for pull requests created by Dependabot.
# It will auto-approve and merge Dependabot PRs for minor/patch updates
# once all checks and branch protection rules pass.

name: Dependabot Auto Merge

# pull_request_target runs in the base branch's context with a write-capable
# GITHUB_TOKEN — required to approve/auto-merge dependabot PRs.
# SECURITY: never add a checkout of the PR head in this workflow (RCE risk).
on:
  pull_request_target:

permissions:
  pull-requests: write  # approve + enable auto-merge (API)
  contents: write        # required for enablePullRequestAutoMerge GraphQL mutation

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
        with:
          target: 'minor'
          merge-method: rebase
          use-github-auto-merge: true
